<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Gaming Café MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Night City staff console sign-in (Design-2). */
  :root {
    --bg: #07060b;
    --card-bg: #12101b;
    --line: #2e2944;
    --line-2: #4a4269;
    --text-primary: #f3f1f8;
    --text-secondary: #cdc8dc;
    --text-muted: #9b95b2;
    --yellow: #fcee0a;
    --cyan: #00f0ff;
    --red: #ff003c;
    --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --body: "Chakra Petch", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --chamfer: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    --chamfer-sm: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1.5rem;
    font-family: var(--body);
    line-height: 1.5;
    color: var(--text-primary);
    background:
      radial-gradient(40rem 26rem at 50% -10%, rgba(252, 238, 10, .1), transparent 65%),
      radial-gradient(40rem 26rem at 100% 110%, rgba(0, 240, 255, .08), transparent 60%),
      linear-gradient(rgba(0, 240, 255, .035) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(0, 240, 255, .035) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
    overflow-x: clip;
  }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 300; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 3px); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .login-wrapper { width: 100%; max-width: 27rem; }

  .brand-header { margin-bottom: 1.75rem; }
  .brand-badge { display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1.25rem; padding: .3rem .7rem; font: 700 .72rem var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--red); border: 1px solid rgba(255, 0, 60, .45); background: rgba(255, 0, 60, .12); }
  .pulse-dot { width: 8px; height: 8px; background: var(--red); box-shadow: 0 0 10px var(--red); }
  .brand-icon-wrap { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 1rem; color: #0a0910; background: var(--yellow); clip-path: var(--chamfer-sm); }
  .brand-header h1 { font: 900 clamp(3.4rem, 12vw, 4.6rem)/.85 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .brand-subtitle { margin-top: .6rem; color: var(--text-muted); font-size: .95rem; }

  .login-card {
    position: relative;
    padding: 1.9rem;
    background: var(--card-bg);
    border: 1px solid var(--line);
    clip-path: var(--chamfer);
  }
  .login-card::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--yellow), var(--cyan)); }

  .error-banner { display: flex; gap: .75rem; align-items: flex-start; margin-bottom: 1.4rem; padding: .85rem 1rem; color: #ffd0da; font-size: .88rem; background: rgba(255, 0, 60, .14); border-left: 3px solid var(--red); }
  .error-banner strong { display: block; color: #fff; }
  .error-banner svg { flex: none; color: var(--red); margin-top: .1rem; }

  .form-group { margin-bottom: 1.2rem; }
  .form-label { display: block; margin-bottom: .45rem; font: 700 .74rem var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--text-secondary); }
  .input-control-wrap { position: relative; }
  .icon-left { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); display: flex; color: var(--text-muted); pointer-events: none; transition: color .2s; }
  .form-input {
    width: 100%; min-height: 50px;
    padding: .7rem 2.8rem .7rem 2.6rem;
    font: 500 1rem var(--body); color: var(--text-primary);
    background: var(--bg); border: 1px solid var(--line);
    clip-path: var(--chamfer-sm);
    transition: border-color .2s, box-shadow .2s;
  }
  .form-input::placeholder { color: var(--text-muted); }
  .form-input:hover { border-color: var(--line-2); }
  .form-input:focus { outline: none; border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan), inset 0 0 18px rgba(0, 240, 255, .12); }
  .input-control-wrap:focus-within .icon-left { color: var(--cyan); }
  .toggle-pwd-btn { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center; color: var(--text-muted); background: none; border: 0; cursor: pointer; }
  .toggle-pwd-btn:hover { color: var(--cyan); }

  .submit-btn {
    position: relative; overflow: hidden;
    width: 100%; min-height: 54px; margin-top: .5rem;
    display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
    font: 900 1.35rem/1 var(--display); text-transform: uppercase; letter-spacing: .08em;
    color: #0a0910; background: var(--yellow); border: 0; cursor: pointer;
    clip-path: var(--chamfer-sm);
    transition: transform .2s var(--ease), filter .2s;
  }
  .submit-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%); transform: translateX(-120%); transition: transform .6s var(--ease); }
  .submit-btn:hover { filter: brightness(1.08); }
  .submit-btn:hover::after { transform: translateX(120%); }
  .submit-btn:hover svg { transform: translateX(4px); }
  .submit-btn svg { transition: transform .25s var(--ease); }
  .submit-btn:active { transform: scale(.98); }
  .submit-btn:focus-visible { clip-path: none; }

  .footer-note { display: flex; align-items: center; justify-content: center; gap: .45rem; margin-top: 1.5rem; font: 500 .74rem var(--mono); letter-spacing: .06em; color: var(--text-muted); }

  @media (prefers-reduced-motion: no-preference) {
    .login-wrapper > * { animation: rise .7s var(--ease) backwards; }
    .login-card { animation-delay: .1s !important; }
    .footer-note { animation-delay: .2s !important; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    .pulse-dot { animation: blink 1.4s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .2; } }
  }
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="brand-header">
    <div class="brand-badge">
      <span class="pulse-dot"></span>
      Operations Console
    </div>
    <div class="brand-icon-wrap" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="14" x="2" y="3" rx="2"/>
        <line x1="8" x2="16" y1="21" y2="21"/>
        <line x1="12" x2="12" y1="17" y2="21"/>
        <circle cx="8" cy="10" r="1.5" fill="currentColor"/>
        <circle cx="16" cy="10" r="1.5" fill="currentColor"/>
      </svg>
    </div>
    <h1>Café PCs</h1>
    <p class="brand-subtitle">Gaming Lounge Fleet Management & Live Telemetry</p>
  </div>

  <div class="login-card">
    {% if form.errors %}
    <div class="error-banner" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" x2="12" y1="8" y2="12"/>
        <line x1="12" x2="12.01" y1="16" y2="16"/>
      </svg>
      <div>
        <strong>Authentication failed</strong>
        <div>Wrong username or password. Please verify credentials.</div>
      </div>
    </div>
    {% endif %}

    <form method="post" id="loginForm">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group">
        <label for="id_username" class="form-label">Username</label>
        <div class="input-control-wrap">
          <span class="icon-left" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input 
            type="text" 
            name="username" 
            id="id_username" 
            class="form-input" 
            placeholder="Enter staff username" 
            autofocus 
            autocapitalize="none" 
            autocomplete="username" 
            maxlength="150" 
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="id_password" class="form-label">Password</label>
        <div class="input-control-wrap">
          <span class="icon-left" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            name="password" 
            id="id_password" 
            class="form-input" 
            placeholder="Enter password" 
            autocomplete="current-password" 
            required
          >
          <button type="button" class="toggle-pwd-btn" id="togglePwd" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span>Log in</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </button>
    </form>
  </div>

  <div class="footer-note">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect width="18" height="18" x="3" y="3" rx="2"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>
    <span>Gaming Café MIS · Local Secure Console</span>
  </div>
</div>

<script>
  const toggleBtn = document.getElementById('togglePwd');
  const pwdInput = document.getElementById('id_password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && pwdInput) {
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      eyeIcon.innerHTML = isPwd 
        ? '<path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>'
        : '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      toggleBtn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
    });
  }
</script>
</body>
</html>
